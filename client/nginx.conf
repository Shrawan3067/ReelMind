server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Allow up to 500MB media uploads
  client_max_body_size 500M;

  # Gzip Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml application/xml+rss image/svg+xml;

  # Security Headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ACME Challenge for Let's Encrypt / Certbot SSL
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # REST API Reverse Proxy
  location /api/ {
    proxy_pass http://server:5001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts for video uploads and long AI inference
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Support range requests for video streaming
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
  }

  # WebSocket Reverse Proxy (Socket.IO Real-Time Updates)
  location /socket.io/ {
    proxy_pass http://server:5001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep WebSocket connection alive
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Static asset caching
  location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
    expires 1M;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # React SPA Single Page Application routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
